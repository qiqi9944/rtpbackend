server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 500m;

    charset utf-8;

    location ~ /\. {
        deny all;
    }

    location ~ ^/(Application|ThinkPHP)(/|$) {
        deny all;
    }

    location ~ ^/Uploads/.*\.(php|php[0-9]?|phtml|phar)(/|$) {
        return 404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location /Uploads/ {
        try_files $uri =404;
    }

    location /Public/ {
        try_files $uri =404;
    }

    location ^~ /Wxapi/ {
        rewrite ^/Wxapi/(.*)$ /index.php/System/Wxapi/$1 last;
    }

    location ~ ^/system/[^/]+/index\.php/([^/]+)/([^/.]+)\.html$ {
        rewrite ^/system/[^/]+/index\.php/([^/]+)/([^/.]+)\.html$ /index.php/System/$1/$2 last;
    }

    location ~ ^/system/[^/]+/([^/]+)/([^/.]+)(/.*)\.html$ {
        rewrite ^/system/[^/]+/([^/]+)/([^/.]+)(/.*)\.html$ /index.php/System/$1/$2$3 last;
    }

    location ~ ^/system/[^/]+/([^/]+)/([^/.]+)\.html$ {
        rewrite ^/system/[^/]+/([^/]+)/([^/.]+)\.html$ /index.php/System/$1/$2 last;
    }

    location ~ ^/system/([^/]+)/([^/.]+)(/.*)\.html$ {
        rewrite ^/system/([^/]+)/([^/.]+)(/.*)\.html$ /index.php/System/$1/$2$3 last;
    }

    location ~ ^/system/([^/]+)/([^/]+)/([^/.]+)\.html$ {
        rewrite ^/system/([^/]+)/([^/]+)/([^/.]+)\.html$ /index.php/System/$2/$3 last;
    }

    location / {
        try_files $uri $uri/ /index.php$uri$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass legacy-php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
    }

    location ^~ /index.php/ {
        set $thinkphp_path_info "";

        if ($uri ~ ^/index\.php(/.*)$) {
            set $thinkphp_path_info $1;
        }

        include fastcgi_params;
        fastcgi_pass legacy-php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $thinkphp_path_info;
    }

    location ~ ^/Public/(code_math\.php|ueditor/php/(controller|action_upload|action_list|action_crawler)\.php)$ {
        include fastcgi_params;
        fastcgi_pass legacy-php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$uri;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param PATH_INFO "";
    }

    location ~ \.php($|/) {
        return 404;
    }
}
