                  <input type="password" id="L_pass" name="password" lay-verify="password" autocomplete="off" class="layui-input">

          <?php if($myinfo!=1){ ?>
          <div class="layui-form-item">
              <label class="layui-form-label">
                  <span class="x-red">*</span>管理栏目
              </label>
              <div class="layui-input-block">
                  <volist name="arr_lm" id="v">
                  <input type="checkbox" name="lanmu[]" value="{$key}" lay-skin="primary" title="{$v}" <?php if(in_array($key,$data['lanmu'])){ ?>checked="checked"<?php } ?>>
                  </volist>
              </div>
          </div>
          <div class="layui-form-item">
              <label class="layui-form-label">
                  <span class='x-red'>*</span>状态
              </label>
              <div class="layui-input-block">
                  <input type="radio" name="status" value="1" title="启用" <?php if($data['status']!=2){ ?>checked<?php } ?>>
                  <div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i>
                      <div>启用</div>
                  </div>
                  <input type="radio" name="status" value="2" title="禁用" <?php if($data['status']==2){ ?>checked<?php } ?>>
                  <div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i>
                      <div>禁用</div>
                  </div>
              </div>
          </div>
          <?php } ?>
          <div class="layui-form-item">
              <label for="L_repass" class="layui-form-label">
              </label>
              <button  class="layui-btn" lay-filter="add" lay-submit="">
                  保存
              </button>
          </div>
      </form>
    </div>
</div>
<script>
    layui.use(['form', 'layer'],
		function() {
			$ = layui.jquery;
			var form = layui.form,
			layer = layui.layer;
			
			<?php if(!$data){ ?>
			//自定义验证规则
			form.verify({
				password: [/(.+){6,16}$/, '密码必须6到16位'],
				password1: function(value) {
					if ($('#L_pass').val() != $('#L_repass').val()) {
						return '两次密码不一致';
					}
				}
			});
			<?php } ?>

			//监听提交
			form.on('submit(add)',function(data) {
				var data = data.field;
				$.ajax({
					type:"post",
					<?php if($myinfo==1){ ?>
					url:"{:U('Index/domyinfo')}",
					<?php }else{ ?>
					url:"{:U('User/doadminadd')}",
					<?php } ?>
					data:data,
					dataType:"json",
					success:function(data){
						if(data.status==1){
							layer.msg(data.info, {icon: 6,time:1000},function () {
								var index = parent.layer.getFrameIndex(window.name);
								parent.layer.close(index);
								<?php if($myinfo!=1){ ?>
								window.parent.location.reload();
								<?php } ?>
							});
							return false;
						}else{
							layer.msg(data.info,{icon:5,time:1000});return false;
						}
					}
	
				});
				return false;
			});

		});
</script>

</body>
</html>
