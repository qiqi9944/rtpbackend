</div>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body ">
                    <form class="layui-form layui-col-space5">
                        <div class="layui-inline layui-show-xs-block">
                            <input class="layui-input"  autocomplete="off" placeholder="开始日" name="starttime" id="start" value="{$starttime}">

                        <div class="layui-inline layui-show-xs-block">

                        <div class="layui-inline layui-show-xs-block">
                            <select name="sel_xs">
                            <option value="0">是否显示</option>
                            <option value="1"<?php if($sel_xs==1){ ?> selected="selected"<?php } ?>>是</option>
                            <option value="2"<?php if($sel_xs==2){ ?> selected="selected"<?php } ?>>否</option>
                            </select>
                        </div>
                        <div class="layui-inline layui-show-xs-block" style="width:120px;">
                            <select name="sel_wz">
                            <option value="0">显示位置</option>
                            <volist name="arr_bannerwz" id="v">
                            <option value="{$key}"<?php if($sel_wz==$key){ ?> selected="selected"<?php } ?>>{$v}</option>
                            </volist>
                            </select>
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <input type="text" name="keywords" value="{$keywords}"  placeholder="请输入Banner名称" autocomplete="off" class="layui-input">
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <button class="layui-btn"  lay-submit="" lay-filter="sreach"><i class="layui-icon">&#xe615;</i></button>
                        </div>
                        <div class="layui-inline layui-show-xs-block index_counts">
                            <p class="counts">共<span>{$count}</span>条信息</p>

                </div>
                <div class="layui-card-header">
                    <button class="layui-btn" onClick="xadmin.open('添加Banner','{:U('Setting/banneradd')}','700','500')"><i class="layui-icon"></i>添加</button>
                </div>
                <form class="layui-form">
                <div class="layui-card-body layui-table-body layui-table-main">
                    <table class="layui-table layui-form">
                        <thead>
                        <tr>
                            <th width="80">推荐度</th>
                            <th>Banner名称</th>
                            <th width="150">图片</th>
                            <th width="150">显示位置</th>
                            <th width="120">发布人</th>
                            <th width="120">发布时间</th>
                            <th width="60">是否显示</th>
                            <th width="50">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <volist name="datalist" id="v">
                        <tr>
                            <td><input type="text" name="displayorder[{$v['id']}]" value="{$v['displayorder']}" style=" width:60px; height:30px;" ></td>
                            <td>{$v['name']}</td>
                            <td><img src="{$v['pic']}" width="100"></td>
                            <td>{$v['wz']}</td>
                            <td>{$v['fbr']}</td>
                            <td><?php echo date('Y-m-d H:i',$v['addtime']); ?></td>
                            <td class="td-status">
                            <?php if($v['isrecommand']==1){ ?><span class="layui-btn layui-btn-normal " > 是 </span><?php } ?>
                            <?php if($v['isrecommand']==0){ ?><span class="layui-btn layui-btn-danger " > 否 </span><?php } ?>
                            </td>
                            <td class="td-manage">
                                <a title="编辑" href="javascript:;" onClick="xadmin.open('编辑','{:U('Setting/banneradd',array('id'=>$v['id']))}','700','500')"
                                   class="ml-5" style="text-decoration:none">
                                    <i class="layui-icon">&#xe642;</i>
                                </a>
                                <a title="删除" href="javascript:;" onClick="member_del(this,'{$v['id']}')"
                                   style="text-decoration:none">
                                    <i class="layui-icon">&#xe640;</i>
                                </a></td>
                        </tr>
                        </volist>
                        </tbody>
                        <tr>
                            <td colspan="8">
                            <button class="layui-btn layui-btn-danger" lay-filter="save" lay-submit=""><i class="layui-icon">&#xe642;</i>提交</button>
                            </td>
                        </tr>
                    </table>
                </div>
                </form>
                <div class="layui-card-body ">
                    <div class="page">
                        {$page}
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
<script>
    layui.use(['layer','laydate','form','element'], function(){
        var layer = layui.layer;
        var laydate = layui.laydate;
        var form = layui.form;
        var element = layui.element;
		element.render();


        //执行一个laydate实例
        laydate.render({
            elem: '#start' //指定元素
        });

        //执行一个laydate实例
        laydate.render({
            elem: '#end' //指定元素
        });
		//监听提交
		form.on('submit(save)',function(data) {
			var data = data.field;
			$.ajax({
				type:"post",
				url:"{:U('Setting/bannersave')}",
				data:data,
				dataType:"json",
				success:function(data){
					if(data.status==1){
						layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
						return false;
					}else{
						layer.msg(data.info,{icon:5,time:1000});return false;
					}
				}

			});
			return false;
		});

    });

    /*用户-删除*/
    function member_del(obj,id){
        layer.confirm('确认要删除吗？',function(index){
            //发异步删除数据
			$.ajax({
				type:'POST',
				url:"{:U('Setting/bannerdel')}",
				data:{
					id: id
				},
				success:function (data) {
					if(data.status ==1){
					    layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
						return false;
					}else{
						layer.msg(data.info,{icon: 5,time:1000});
					}
				}
			});
			return false;
        });
    }

</script>
</html>
