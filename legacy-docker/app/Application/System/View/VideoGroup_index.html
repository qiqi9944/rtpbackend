<script>
    layui.use(['layer','form','element'], function(){
        var layer = layui.layer;
        var form = layui.form;
        var element = layui.element;
		element.render();

		//监听提交
		form.on('submit(save)',function(data) {
			var data = data.field;
			$.ajax({
				type:"post",
				url:"{:U('VideoGroup/dosave')}",
				data:data,
				dataType:"json",
				success:function(data){
					if(data.status==1){
						layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
						return false;
					}else{
						layer.msg(data.info,{icon:5,time:1000});return false;
					}
				}

			});
			return false;
		});


    });

    /*分组-删除*/
    function group_del(obj,id){
        layer.confirm('删除后该分组下的视频将归入未分组，确认要删除吗？',function(index){
			$.ajax({
				type:'POST',
				url:"{:U('VideoGroup/del')}",
				data:{
					id: id
				},
				success:function (data) {
					if(data.status ==1){
						layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
					}else{
						layer.msg(data.info,{icon: 5,time:1000});
					}
				}
			});
			return false;
        });
    }

</script>
