<include file="Public:header"/>
<body>
<div class="layui-card">
  <form class="layui-form layui-form-pane">
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>品类</label>
      <div class="layui-input-block">
        <select name="type" lay-verify="required">
          <volist name="arr_sjtype" id="v">
          <option value="{$key}">{$key}-{$v}</option>
          </volist>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>市场</label>
      <div class="layui-input-block">
        <input type="radio" name="market" value="中国" title="中国" checked>
        <input type="radio" name="market" value="全球" title="全球">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>品径</label>
      <div class="layui-input-block">
        <input type="radio" name="lx" value="零售" title="零售" checked>
        <input type="radio" name="lx" value="出货" title="出货">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>年份</label>
      <div class="layui-input-inline">
        <input type="text" name="nd" placeholder="如2025" class="layui-input">
      </div>
      <label class="layui-form-label"><span class="x-red">*</span>年月</label>
      <div class="layui-input-inline">
        <input type="text" name="yd" placeholder="如2025.06 或 25.06" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">渠道</label>
      <div class="layui-input-inline"><input type="text" name="ds" placeholder="如 线上/垂直电商" class="layui-input"></div>
      <label class="layui-form-label"><span class="x-red">*</span>品牌</label>
      <div class="layui-input-inline"><input type="text" name="pp" class="layui-input"></div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">技术</label>
      <div class="layui-input-inline"><input type="text" name="gy1" placeholder="如 DLP/LCD" class="layui-input"></div>
      <label class="layui-form-label">价格档</label>
      <div class="layui-input-inline"><input type="text" name="gy2" placeholder="如 ≤0.5K" class="layui-input"></div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">销量(万台)</label>
      <div class="layui-input-inline"><input type="text" name="xl" class="layui-input"></div>
      <label class="layui-form-label">销额(亿元)</label>
      <div class="layui-input-inline"><input type="text" name="xe" class="layui-input"></div>
    </div>
    <div class="layui-form-item">
      <button class="layui-btn" lay-filter="add" lay-submit="">保存</button>
    </div>
  </form>
</div>
<script>
  layui.use(['form','layer'], function(){
    var form=layui.form, layer=layui.layer;
    form.on('submit(add)', function(data){
      var data=data.field;
      $.ajax({ type:'post', url:"{:U('Datamain/doadd')}", data:data, dataType:'json',
        success:function(res){
          if(res.status==1){
            layer.msg(res.info,{icon:6,time:1000},function(){
              var index=parent.layer.getFrameIndex(window.name);
              parent.layer.close(index); window.parent.location.reload();
            }); return false;
          }else{ layer.msg(res.info,{icon:5,time:1000}); return false; }
        }
      });
      return false;
    });
  });
</script>
</body>
</html>
