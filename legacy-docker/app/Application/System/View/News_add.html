<include file="Public:header"/>
<!--百度编辑器-->
<script src="/Public/ueditor/ueditor.config.js"></script>
<script src="/Public/ueditor/ueditor.all.min.js"></script>
<script src="/Public/ueditor/lang/zh-cn/zh-cn.js"></script>
<body>
<div class="layui-card">
    <form class="layui-form layui-form-pane">
        <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
            <div class="layui-tab-content" >
                <div class="layui-tab-item layui-show">
                    <input type="hidden" name="id" value="{$data.id}">
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <span class='x-red'>*</span>新闻标题
                        </label>
                        <div class="layui-input-block">
                            <input type="text" name="name" autocomplete="off" value="{$data['name']}" lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <span class='x-red'>*</span>新闻分类
                        </label>
                        <div class="layui-input-block">
                            <select name="type" lay-verify="required">
                                <option value="">---请选择---</option>
                                <volist name="arr_newstype" id="v">
                                <option value="{$key}"<?php if($data['type']==$key){ ?> selected="selected"<?php } ?>>{$v}</option>
                                </volist>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            产品分类
                        </label>
                        <div class="layui-input-block">
                            <select name="sjtype">
                                <option value="0">不限</option>
                                <volist name="arr_sjtype" id="v">
                                <option value="{$key}"<?php if($data['sjtype']==$key){ ?> selected="selected"<?php } ?>>{$v}</option>
                                </volist>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            来源
                        </label>
                        <div class="layui-input-block">
                            <input type="text" name="source" autocomplete="off" value="{$data['source']}" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            封面图
                        </label>
                        <div class="layui-input-block">
                            <div class="layui-upload">
                              <button type="button" class="layui-btn" id="upload_pic1">上传图片</button><span>（最优图片尺寸：250*200）</span>
                              <div class="layui-upload-list" id="upload_pic_list1">
                                <?php if($data['pic']){ ?>
                                <p class="upload_pic"><a href="{$data['pic']}" target="_blank"><img class="upload_img" src="{$data['pic']}"></a><a class="uploda_del" onClick="return upload_del(this);"></a><input type="hidden" name="pic" value="{$data['pic']}"></p>
                                <?php } ?>
                              </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <span class='x-red'>*</span>公众号文章
                        </label>
                        <div class="layui-input-block">
                            <input type="radio" name="isgzh" value="1" title="是" lay-filter="isgzh" <?php if($data['url'] || !$data['id']){ ?>checked="checked"<?php } ?>>
                            <input type="radio" name="isgzh" value="2" title="否" lay-filter="isgzh" <?php if(!$data['url'] && $data['id']){ ?>checked="checked"<?php } ?>>
                        </div>
                    </div>
                    <div class="layui-form-item" id="urld" <?php if(!$data['url'] && $data['id']){ ?>style="display:none;"<?php } ?>>
                        <label for="link" class="layui-form-label">
                            <span class='x-red'>*</span>跳转链接
                        </label>
                        <div class="layui-input-block">
                            <input type="text" name="url" autocomplete="off" value="{$data['url']}" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item" id="contentd" <?php if($data['url'] || !$data['id']){ ?>style="display:none;"<?php } ?>>
                        <label for="link" class="layui-form-label">
                            <span class="x-red">*</span>新闻内容
                        </label>
                        <div class="layui-input-inline">
                            <textarea id="content" name="content">{:htmlspecialchars_decode(stripslashes($data['content']))}</textarea>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            新闻标签
                        </label>
                        <div class="layui-input-block">
                            <volist name="arr_newstag" id="v">
                            <input type="radio" name="tag" value="{$key}" lay-skin="primary" title="{$v}" <?php if($data['tag']==$key){ ?>checked="checked"<?php } ?>>
                            </volist>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <span class='x-red'>*</span>是否显示
                        </label>
                        <div class="layui-input-block">
                            <input type="radio" name="isrecommand" value="1" title="是" <?php if($data['isrecommand']==1 || !$data['id']){ ?>checked="checked"<?php } ?>>
                            <input type="radio" name="isrecommand" value="0" title="否" <?php if($data['isrecommand']==0 && $data['id']){ ?>checked="checked"<?php } ?>>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label for="link" class="layui-form-label">
                            <span class='x-red'>*</span>发布时间
                        </label>
                        <div class="layui-input-block">
                            <input type="text" name="addtime" id="addtime" autocomplete="off" value="<?php if($data['addtime']){ ?><?php echo date('Y-m-d',$data['addtime']); ?><?php } ?>" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <button class="layui-btn" type="button" lay-filter="add" lay-submit="">
                            保存
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>
<script type="text/javascript">
    //实例化编辑器
    //建议使用工厂方法getEditor创建和引用编辑器实例，如果在某个闭包下引用该编辑器，直接调用UE.getEditor('editor')就能拿到相关的实例
    UE.getEditor('content',{initialFrameWidth:630,initialFrameHeight:400,autoFloatEnabled:false,autoHeightEnabled: false, zIndex: 100});
</script>
<script>
    layui.use(['form', 'layer','laydate','upload'],
		function() {
			$ = layui.jquery;
			var form = layui.form,
			layer = layui.layer;
            var laydate = layui.laydate;
            var upload = layui.upload;
			
			//执行一个laydate实例
			laydate.render({
				elem: '#addtime' //指定元素
				,trigger: 'click'
			});
			
			var loadingIndex;
            var uploadInst = upload.render({
			  elem: '#upload_pic1'
			  ,url: "{:U('Ajax/uploadimg')}" //改成您自己的上传接口
			  ,method: 'post'
			  ,before:function(obj){
				  loadingIndex = layer.load(1, {
					  shade: [0.5,'#000'] //0.1透明度的背景
				  });
				  this.data={'w':250,'h':200};
			  }
			  ,done: function(res){
				  layer.close(loadingIndex);
				  //如果上传失败
				  if(res.code > 0){
					  return layer.msg(res.msg);
				  }else{
					  //上传成功
					  var html='<p class="upload_pic"><a href="'+res.src+'" target="_blank"><img class="upload_img" src="'+res.src+'"></a><a class="uploda_del" onClick="return upload_del(this);"></a><input type="hidden" name="pic" value="'+res.src+'"></p>';
					  $('#upload_pic_list1').html(html);
				  }
			  }
			});
			form.on('radio(isgzh)',function(data) {
				var is_gzh=data.value;
				if(is_gzh==1){
					$('#urld').show();
					$('#contentd').hide();
				}else{
					$('#urld').hide();
					$('#contentd').show();
				}
			});
			//监听提交
			form.on('submit(add)',function(data) {
				var data = data.field;
				$.ajax({
					type:"post",
					url:"{:U('News/doadd')}",
					data:data,
					dataType:"json", 
					success:function(data){
						if(data.status==1){
							layer.msg(data.info, {icon: 6,time:1000},function () {
								var index = parent.layer.getFrameIndex(window.name);
								parent.layer.close(index);
								window.parent.location.reload();
							});
							return false;
						}else{
							layer.msg(data.info,{icon:5,time:1000});return false;
						}
					}
	
				});
				return false;
			});

		});
</script>

</body>
</html>
