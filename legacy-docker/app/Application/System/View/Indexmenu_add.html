<include file="Public:header"/>
<body>
<div class="layui-card">
    <form class="layui-form layui-form-pane">
        <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
            <div class="layui-tab-content" >
                <div class="layui-tab-item layui-show">
                    <input type="hidden" name="id" value="{$data.id}">
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <span class='x-red'>*</span>菜单名称
                        </label>
                        <div class="layui-input-block">
                            <input type="text" name="name" autocomplete="off" value="{$data['name']}" lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <span class='x-red'>*</span>数据type
                        </label>
                        <div class="layui-input-block">
                            <select name="type" lay-verify="required">
                            <volist name="arr_sjtype" id="v">
                            <option value="{$key}"<?php if($data['type']==$key){ ?> selected="selected"<?php } ?>>{$key}-{$v}</option>
                            </volist>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">绑定品类<br>(多选)</label>
                        <div class="layui-input-block">
                            <volist name="arr_sjtype" id="v">
                            <input type="checkbox" name="cates[]" value="{$key}" title="{$key}-{$v}"
                                <?php if(in_array($key,(array)$cate_bind)){ ?>checked="checked"<?php } ?>>
                            </volist>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            图标
                        </label>
                        <div class="layui-input-block">
                            <div class="layui-upload">
                              <button type="button" class="layui-btn" id="upload_pic1">上传图标</button>
                              <div class="layui-upload-list" id="upload_pic_list1">
                                <?php if($data['pic']){ ?>
                                <p class="upload_pic"><a href="{$data['pic']}" target="_blank"><img class="upload_img" src="{$data['pic']}"></a><a class="uploda_del" onClick="return upload_del(this);"></a><input type="hidden" name="pic" value="{$data['pic']}"></p>
                                <?php } ?>
                              </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label for="link" class="layui-form-label">
                            排序
                        </label>
                        <div class="layui-input-inline">
                            <input type="text" name="displayorder" autocomplete="off" value="{$data['displayorder']}" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            是否显示
                        </label>
                        <div class="layui-input-block">
                            <input type="radio" name="isrecommand" value="1" title="是" <?php if($data['isrecommand']==1){ ?>checked="checked"<?php } ?>>
                            <input type="radio" name="isrecommand" value="0" title="否" <?php if($data['isrecommand']==0){ ?>checked="checked"<?php } ?>>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <button class="layui-btn" type="button" lay-filter="add" lay-submit="">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<script>
    layui.use(['form', 'layer','upload'],
		function() {
			$ = layui.jquery;
			var form = layui.form,
			layer = layui.layer;
            var upload = layui.upload;

			var loadingIndex;
            var uploadInst = upload.render({
			  elem: '#upload_pic1'
			  ,url: "{:U('Ajax/uploadimg')}"
			  ,method: 'post'
			  ,done: function(res){
				  layer.close(loadingIndex);
				  if(res.code > 0){
					  return layer.msg(res.msg);
				  }else{
					  var html='<p class="upload_pic"><a href="'+res.src+'" target="_blank"><img class="upload_img" src="'+res.src+'"></a><a class="uploda_del" onClick="return upload_del(this);"></a><input type="hidden" name="pic" value="'+res.src+'"></p>';
					  $('#upload_pic_list1').html(html);
					  form.render();
				  }
			  }
			});
			form.on('submit(add)',function(data) {
				var data = data.field;
				$.ajax({
					type:"post",
					url:"{:U('Indexmenu/doadd')}",
					data:data,
					dataType:"json",
					success:function(data){
						if(data.status==1){
							layer.msg(data.info, {icon: 6,time:1000},function () {
								var index = parent.layer.getFrameIndex(window.name);
								parent.layer.close(index);
								window.parent.location.reload();
							});
							return false;
						}else{
							layer.msg(data.info,{icon:5,time:1000});return false;
						}
					}
				});
				return false;
			});
		});
</script>
</body>
</html>
