<include file="Public:header"/>
<body>
<div class="layui-card">
  <form class="layui-form layui-form-pane">
    <input type="hidden" name="id" value="{$info['id']}">
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>品类</label>
      <div class="layui-input-block">
        <select name="type" lay-verify="required">
          <volist name="arr_sjtype" id="v">
          <option value="{$key}" <if condition="$info['type']==$key">selected</if>>{$key}-{$v}</option>
          </volist>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>市场</label>
      <div class="layui-input-block">
        <input type="radio" name="market" value="中国" title="中国" <if condition="$info['market']=='中国'">checked</if>>
        <input type="radio" name="market" value="全球" title="全球" <if condition="$info['market']=='全球'">checked</if>>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>品径</label>
      <div class="layui-input-block">
        <input type="radio" name="lx" value="零售" title="零售" <if condition="$info['lx']=='零售'">checked</if>>
        <input type="radio" name="lx" value="出货" title="出货" <if condition="$info['lx']=='出货'">checked</if>>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"><span class="x-red">*</span>年份</label>
      <div class="layui-input-inline">
        <input type="text" name="nd" value="{$info['nd']}" class="layui-input">
      </div>
      <label class="layui-form-label"><span class="x-red">*</span>年月</label>
      <div class="layui-input-inline">
        <input type="text" name="yd" value="{$info['yd']}" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">渠道</label>
      <div class="layui-input-inline"><input type="text" name="ds" value="{$info['ds']}" class="layui-input"></div>
      <label class="layui-form-label"><span class="x-red">*</span>品牌</label>
      <div class="layui-input-inline"><input type="text" name="pp" value="{$info['pp']}" class="layui-input"></div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">技术</label>
      <div class="layui-input-inline"><input type="text" name="gy1" value="{$info['gy1']}" class="layui-input"></div>
      <label class="layui-form-label">价格档</label>
      <div class="layui-input-inline"><input type="text" name="gy2" value="{$info['gy2']}" class="layui-input"></div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">销量</label>
      <div class="layui-input-inline"><input type="text" name="xl" value="{$info['xl']}" class="layui-input"></div>
      <label class="layui-form-label">销额</label>
      <div class="layui-input-inline"><input type="text" name="xe" value="{$info['xe']}" class="layui-input"></div>
    </div>
    <div class="layui-form-item">
      <button class="layui-btn" lay-filter="edit" lay-submit="">保存</button>
    </div>
  </form>
</div>
<script>
  layui.use(['form','layer'], function(){
    var form=layui.form, layer=layui.layer;
    form.on('submit(edit)', function(data){
      var data=data.field;
      $.ajax({ type:'post', url:"{:U('Datamain/doedit')}", data:data, dataType:'json',
        success:function(res){
          if(res.status==1){
            layer.msg(res.info,{icon:6,time:1000},function(){
              var index=parent.layer.getFrameIndex(window.name);
              parent.layer.close(index); window.parent.location.reload();
            }); return false;
          }else{ layer.msg(res.info,{icon:5,time:1000}); return false; }
        }
      });
      return false;
    });
  });
</script>
</body>
</html>
