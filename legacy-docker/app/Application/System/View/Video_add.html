<script>
    layui.use(['form', 'layer','upload'],
		function() {
			$ = layui.jquery;
			var form = layui.form,
			layer = layui.layer;
            var upload = layui.upload;

			var loadingIndex;
            var uploadInst = upload.render({
			  elem: '#upload_pic1'
			  ,url: "{:U('Ajax/uploadimg')}" //改成您自己的上传接口
			  ,method: 'post'
			  ,before:function(obj){
				  loadingIndex = layer.load(1, {
					  shade: [0.5,'#000'] //0.1透明度的背景
				  });
			  }
			  ,done: function(res){
				  layer.close(loadingIndex);
				  //如果上传失败
				  if(res.code > 0){
					  return layer.msg(res.msg);
				  }else{
					  //上传成功
					  var html='<p class="upload_pic"><a href="'+res.src+'" target="_blank"><img class="upload_img" src="'+res.src+'"></a><a class="uploda_del" onClick="return upload_del(this);"></a><input type="hidden" name="pic" value="'+res.src+'"></p>';
					  $('#upload_pic_list1').html(html);
				  }
			  }
			});
			//监听提交
			form.on('submit(add)',function(data) {
				var data = data.field;
				$.ajax({
					type:"post",
					url:"{:U('Video/doadd')}",
					data:data,
					dataType:"json",
					success:function(data){
						if(data.status==1){
							layer.msg(data.info, {icon: 6,time:1000},function () {
								var index = parent.layer.getFrameIndex(window.name);
								parent.layer.close(index);
								window.parent.location.reload();
							});
							return false;
						}else{
							layer.msg(data.info,{icon:5,time:1000});return false;
						}
					}

				});
				return false;
			});

		});
</script>

</body>
