</div>
<style>
.layui-table td, .layui-table th { padding:9px 8px;}
</style>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body ">
                    <form class="layui-form layui-col-space5">
                        <div class="layui-inline layui-show-xs-block">
                            <input class="layui-input"  autocomplete="off" placeholder="开始日" name="starttime" id="start" value="{$starttime}">

                        <div class="layui-inline layui-show-xs-block" style="width:120px;">
                            <select name="sel_xs">
                            <option value="0">是否显示</option>

                            <option value="2"<?php if($sel_xs==2){ ?> selected="selected"<?php } ?>>否</option>
                            </select>
                        </div>
                        <div class="layui-inline layui-show-xs-block" style="width:120px;">

                            </volist>
                            </select>
                        </div>
                        <div class="layui-inline layui-show-xs-block" style="width:120px;">
                            <select name="sel_sjlb">

                            <volist name="arr_sjtype" id="v">

                        <div class="layui-inline layui-show-xs-block">
                            <input type="text" name="keywords" value="{$keywords}"  placeholder="请输入新闻标题" autocomplete="off" class="layui-input">
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <button class="layui-btn"  lay-submit="" lay-filter="sreach"><i class="layui-icon">&#xe615;</i></button>
                        </div>
                        <div class="layui-inline layui-show-xs-block index_counts">
                            <p class="counts">共<span>{$count}</span>条信息</p>
                        </div>
                    </form>
                </div>
                <div class="layui-card-header">
                    <button class="layui-btn layui-btn-danger" onClick="delAll()"><i class="layui-icon"></i>批量删除</button>
                    <button class="layui-btn" onClick="xadmin.open('添加新闻','{:U('News/add')}','800')"><i class="layui-icon"></i>添加</button>
                </div>
                <form class="layui-form">
                <div class="layui-card-body layui-table-body layui-table-main">
                    <table class="layui-table layui-form">
                        <thead>
                        <tr>
                            <th width="50"><input type="checkbox" lay-filter="checkall" name="" lay-skin="primary"></th>
                            <th width="80">推荐度</th>
                            <th>新闻标题</th>
                            <th width="150">小程序链接</th>
                            <th width="60">新闻分类</th>
                            <th width="80">产品分类</th>
                            <th width="120">封面图</th>
                            <th width="60">发布人</th>
                            <th width="80">发布时间</th>
                            <th width="60">浏览量</th>
                            <th width="60">是否显示</th>
                            <th width="50">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <volist name="datalist" id="v">
                        <tr>
                            <td><input type="checkbox" name="id" value="{$v['id']}" lay-skin="primary"></td>
                            <td><input type="text" name="displayorder[{$v['id']}]" value="{$v['displayorder']}" style=" width:60px; height:30px;" ></td>
                            <td><?php if($v['tag']){ ?>【{$arr_newstag[$v['tag']]}】<?php } ?>{$v['name']}</td>
                            <td>/pages/yanbao/view?id={$v['id']}</td>
                            <td>{$arr_newstype[$v['type']]}</td>
                            <td><?php if($v['sjtype']){ ?>{$arr_sjtype[$v['sjtype']]}<?php }else{ ?>不限<?php } ?></td>
                            <td><?php if($v['pic']){ ?><img src="{$v['pic']}" width="100"><?php } ?></td>
                            <td>{$v['fbr']}</td>
                            <td><?php echo date('Y-m-d',$v['addtime']); ?></td>
                            <td>{$v['click']}</td>
                            <td class="td-status">
                            <?php if($v['isrecommand']==1){ ?><span class="layui-btn layui-btn-normal " > 是 </span><?php } ?>
                            <?php if($v['isrecommand']==0){ ?><span class="layui-btn layui-btn-danger " > 否 </span><?php } ?>
                            </td>
                            <td class="td-manage">
                                <a title="编辑" href="javascript:;" onClick="xadmin.open('编辑','{:U('News/add',array('id'=>$v['id']))}','800')"
                                   class="ml-5" style="text-decoration:none">
                                    <i class="layui-icon">&#xe642;</i>
                                </a>
                                <a title="删除" href="javascript:;" onClick="member_del(this,'{$v['id']}')"
                                   style="text-decoration:none">
                                    <i class="layui-icon">&#xe640;</i>
                                </a></td>
                        </tr>
                        </volist>
                        <tr>
                            <td colspan="11">
                            <button class="layui-btn layui-btn-danger" lay-filter="save" lay-submit=""><i class="layui-icon">&#xe642;</i>提交</button>
                            </td>
                        </tr>
                    </table>
                </div>
                </form>

                <div class="layui-card-body ">
                    <div class="page">
                        {$page}
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
<script>
    layui.use(['layer','laydate','form','element'], function(){
        var layer = layui.layer;
        var laydate = layui.laydate;
        var form = layui.form;
        var element = layui.element;
		element.render();


        // 监听全选
        form.on('checkbox(checkall)', function(data){

            if(data.elem.checked){
                $('tbody input').prop('checked',true);
            }else{
                $('tbody input').prop('checked',false);
            }
            form.render('checkbox');
        });

        //执行一个laydate实例
        laydate.render({
            elem: '#start' //指定元素
        });

        //执行一个laydate实例
        laydate.render({
            elem: '#end' //指定元素
        });
		
		//监听提交
		form.on('submit(save)',function(data) {
			var data = data.field;
			$.ajax({
				type:"post",
				url:"{:U('News/dosave')}",
				data:data,
				dataType:"json",
				success:function(data){
					if(data.status==1){
						layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
						return false;
					}else{
						layer.msg(data.info,{icon:5,time:1000});return false;
					}
				}

			});
			return false;
		});


    });

    /*用户-删除*/
    function member_del(obj,id){
        layer.confirm('确认要删除吗？',function(index){
            //发异步删除数据
			$.ajax({
				type:'POST',
				url:"{:U('News/del')}",
				data:{
					id: id
				},
				success:function (data) {
					if(data.status ==1){
						layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
					}else{
						layer.msg(data.info,{icon: 5,time:1000});
					}
				}
			});
			return false;
        });
    }



    function delAll (argument) {
        var ids = [];

        // 获取选中的id
        $('tbody input').each(function(index, el) {
            if($(this).prop('checked')){
                ids.push($(this).val())
            }
        });
        layer.confirm('确认要删除吗？',function(index){
			$.ajax({
				type:'POST',
				url:"{:U('News/save')}",
				data:{
					choose: ids.toString()
				},
				success:function (data) {
					if(data.status ==1){
						layer.msg(data.info, {icon: 6,time:1000},function () {
							window.parent.location.reload();
						});
					}else{
						layer.msg(data.info,{icon: 5,time:1000});
					}
				}
			});
			return false;
        });
    }
</script>
</html>
